[project]
name = "local-chorus"
version = "0.1.0"
description = "A local-first AI assistant — local LLMs, local memory, local voice. No cloud."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Julien", email = "julienbrs1er@gmail.com" },
]
keywords = ["llm", "local-llm", "ollama", "ai-assistant", "agent", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "loguru>=0.7.2",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/lejusdefruits/local-chorus"
Repository = "https://github.com/lejusdefruits/local-chorus"
Issues = "https://github.com/lejusdefruits/local-chorus/issues"

[project.scripts]
chorus = "local_chorus.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.11.0",
    "types-pyyaml>=6.0.0",
]

# ============================================================
# Build system — hatchling is the modern default that pairs with uv.
# ============================================================
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_chorus"]

# ============================================================
# Ruff — lint + format. One tool replaces black, isort, flake8.
# ============================================================
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# Rule families enabled. Start strict; relax when something is wrong, not eagerly.
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "B",    # bugbear (common bugs)
    "UP",   # pyupgrade (modern syntax)
    "ANN",  # flake8-annotations
    "RUF",  # ruff-specific rules
    "SIM",  # simplifications
    "PTH",  # use pathlib over os.path
    "TID",  # tidy imports
    "PL",   # pylint subset
    "C4",   # comprehensions
]
ignore = [
    "ANN401",  # allow `Any` — useful for **kwargs forwarders
    "ANN101",  # self annotation (deprecated in modern ruff, kept here for older pre-commit pins)
    "ANN102",  # cls annotation (same reason)
    "PLR0913", # allow many args (CLI commands tend to have many)
    "PLR2004", # magic numbers OK in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "S101"]  # don't require type hints in tests; allow asserts

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ============================================================
# Pytest
# ============================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
]
markers = [
    "slow: tests that take more than 1s to run",
    "integration: tests that hit a real Ollama server",
]

[tool.coverage.run]
source = ["src/local_chorus"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true

# ============================================================
# Mypy — static typing. Not yet --strict, but tightening as the code grows.
# ============================================================
[tool.mypy]
python_version = "3.12"
files = ["src/local_chorus"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true
